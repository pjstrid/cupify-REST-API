name: Check

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: check formatting
        run: npm run format:check

      - name: Check syntax
        run: |
          for file in $(git ls-files "*.mjs"); do
            node --check "$file"
          done
